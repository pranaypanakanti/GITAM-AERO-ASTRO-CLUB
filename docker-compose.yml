services:
  postgres:
    image: postgres:16-alpine
    container_name: gaac-postgres
    environment:
      POSTGRES_DB: gaac_db
      POSTGRES_USER: gaac_user
      POSTGRES_PASSWORD: gaac_password
    ports:
      - "5432:5432"
    volumes:
      - gaac_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gaac_user -d gaac_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: gaac-backend:latest
    container_name: gaac-backend
    build: .
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/gaac_db
      SPRING_DATASOURCE_USERNAME: gaac_user
      SPRING_DATASOURCE_PASSWORD: gaac_password

      SERVER_ADDRESS: 0.0.0.0

      SPRINGDOC_API_DOCS_PATH: /v3/api-docs
      SPRINGDOC_SWAGGER_UI_PATH: /swagger-ui.html
      SPRINGDOC_SWAGGER_UI_ENABLED: "true"

      LOGGING_LEVEL_COM_GAAC_GAAC_BACKEND: DEBUG
      LOGGING_LEVEL_ORG_SPRINGDOC: INFO

volumes:
  gaac_pgdata: